[system]
adapter = AC
battery = BAT1
graphics_card = intel_backlight
network_interface_wireless = wlp2s0
network_interface_wired = enp9s0

[module/tray]
type              = internal/tray
format-background = ${colors.background}
tray-background   = ${colors.background}
format-padding    = 0
tray-padding      = 0
tray-spacing      = 2
tray-size         = 100

[module/storage]
type = internal/fs
mount-0 = /
interval = 60
fixed-values = true
spacing = 4
warn-percentage = 75
label-mounted = 󰋊 %percentage_used%%
format-mounted-foreground = ${colors.black}
format-mounted-background = ${colors.white}

[module/volume]
type=internal/pulseaudio
; sink=alsa_output.pci-0000_00_1f.3.analog-stereo
use-ui-max=false
interval=1
format-volume=<label-volume>
label-volume = "󰕾%percentage:3%%"
label-volume-foreground=${colors.foreground}
label-volume-background=${colors.background}
format-muted=<label-muted>
label-muted="󰝟%percentage:3%%"
label-muted-background=${colors.background}
label-muted-foreground=${colors.foreground}

[module/menu]
type    = custom/text
; Content
content            = 
content-foreground = ${colors.sky}
content-padding    = 1
; Click
click-left         = /home/bruno/.config/rofi/launcher/run.sh
click-right        = /home/bruno/.config/rofi/launcher/run.sh

[module/github-notifications]
type = custom/script
format-prefix-foreground = ${colors.foreground}
format-foreground = ${colors.foreground}
format-background = ${colors.background}
format-prefix = " "
label = "%output% "
exec = .config/polybar/scripts/github_notifications.sh
interval = 300
click-left = st tmux new-session -n "gh" gh dash

[module/i3]
type = internal/i3
; Additional
index-sort = true
; Focused.
label-focused             = %name%
label-focused-underline   = ${colors.blue}
label-focused-background  = ${colors.background-alt}
label-focused-foreground  = ${colors.foreground}
label-focused-padding     = 1
; Visible
label-visible             = %name%
label-visible-padding     = 1
label-visible-background  = ${colors.background-alt}
label-visible-foreground  = ${colors.foreground}
; Urgent.
label-urgent            = %name%
label-urgent-padding    = 1
label-urgent-background = ${colors.label-urgent}
label-urgent-foreground = ${colors.foreground}
; Empty.
label-unfocused = "%name%"
label-unfocused-padding = 1
label-unfocused-foreground = ${colors.foreground}
label-unfocused-background= ${colors.background-alt}

