[global/wm]
include-file = $HOME/.config/polybar/themes/mocha.ini
include-file = $HOME/.config/polybar/modules.ini
include-file = ~/.config/polybar/utils.ini
include-file = ~/.config/polybar/networks.ini

[bar/base]
type = bar
width = 98.95%
height = 2.5%
radius = 0
dpi-x = 96
dpi-y = 96
background = ${colors.background}
foreground = ${colors.text}
line-size = 1pt
border-size  = 4pt
border-color = ${colors.background}
offset-y = 0.65%
offset-x = 0.54%
padding-left = 0
padding-right = 0
module-margin = 0
cursor-click  = pointer
cursor-scroll = ns-resize
enable-ipc = true
wm-restack = i3
override-redirect = true
fixed-center = true

font-0 = JetBrains Mono Nerd Font:pixelsize=9;2
font-1 = JetBrains Mono Nerd Font:pixelsize=12;3
font-2 = JetBrains Mono Nerd Font:pixelsize=10:antialias=false;3
font-3 = JetBrains Mono Nerd Font:pixelsize=14;3

modules-left    = menu space left time space-alt date right space space-small
modules-center  = i3
modules-right   = space volume space left wlan right

[settings]
screenchange-reload = true
pseudo-transparency = true
